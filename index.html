<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./image1.jpeg" type="image/x-icon">
    <title>Saylani Replica Registration Form</title>
</head>
<body>
    <center>
    <img src="./download.png" width="300" id="image">
    <table  cellspacing="10px">
        <tr>
            <td id="text1">Registration</td>
            <td id="text2">Download ID Card</td>
            <td id="text3">Results</td>
        </tr>
    </table>
    <table cellspacing="10">
    <form action="">
        <tr>
      <td><label for="country" required>Select country</label> <br>
      <select name="country" id="country" >
        <option value="country">Select a country</option>
        <option value="country">Pakistan</option>
        <option value="country">Turkey</option>
        <option value="country">Yemen</option>
      </select> 
      </td>
      <td>
      <label for="class preference" required>Select class preference</label> <br>
      <select name="country" id="country">
        <option value="class">Select a class preference</option>
        <option value="class">Online</option>
        <option value="class">Onsite</option>
      </select> 
    </td>
      </tr>
      <tr>
        <td>
      <label for="gender" required>Select gender</label> <br>
      <select name="gender" id="gender">
        <option value="gender">Select a gender</option>
        <option value="gender">Male</option>
        <option value="gender">Female</option>
      </select> 
      </td>
      <td>
      <label for="city" required>Select city</label> <br>
      <select name="city" id="city">
        <option value="city">Select a city</option>
        <option value="city">Karachi</option>
        <option value="city">Hyderabad</option>
        <option value="city">Sukkhur</option>
      </select> 
      </td>
      </tr>
      <tr>
        <td>
      <label for="course or event" required>Select course or event</label> <br>
      <select name="course or event" id="course or event">
        <option value="course or event">Select a course or event</option>
        <option value="course or event">Web and Application Development</option>
        <option value="course or event">Artificial Intelligence</option>
        <option value="course or event">Graphic Designing</option>
      </select> 
      </td>
      <td>
      <label for="full name" required>Full Name</label> <br>
      <input type="text">
      </td>
      </tr>
      <tr>
      <td><label for="father name" required>Father Name</label> <br>
      <input type="text">
      </td>
      <td>
      <label for="email" required>Email</label> <br>
      <input type="email">
      </td>
      </tr>
      <tr>
        <td>
      <label for="phone" required>Phone</label> <br>
      <input type="number">
      </td>
      <td>
      <label for="cnic" required>CNIC</label> <br>
      <input type="number">
      </td>
      </tr>
      <tr>
      <td><label for="father cnic">Father CNIC (optional)</label> <br>
      <input type="number">
      </td>
      <td>
      <label for="date of birth" required>Date Of Birth</label> <br>
      <input type="date">
      </td>
      </tr>
      <tr>
      <td><label for="computer proficency" required>Select computer proficency</label> <br>
        <select name="computer proficency" id="computer proficency">
        <option value="computer proficency">Select your computer proficency</option>
        <option value="computer proficency">None</option>
        <option value="computer proficency">Intermediate</option>
        <option value="computer proficency">Advanced</option>
        <option value="computer proficency">Beginner</option>
      </select> 
        </td>
        <td>
      <label for="laptop" required>Do you have a laptop?</label> <br>
      <select name="laptop" id="laptop">
        <option value="laptop">Do you have a laptop?</option>
        <option value="laptop">Yes</option>
        <option value="laptop">No</option>
      </select>
       </td>
      </tr>
       </table>
      <label for="last qualification" id="qualification" required>Last qualification</label> <br>
<select name="last qualification" id="last qualification">
    <option value="last qualification">Last qualification</option>
    <option value="last qualification">Matric</option>
    <option value="last qualification">Intermediate</option>
    <option value="last qualification">Undergraduate</option>
    <option value="last qualification">Graduate</option>
    <option value="last qualification">Masters</option>
    <option value="last qualification">PHD</option>
    <option value="last qualification">Others</option>
</select>
<br>
      <label for="address" required>Address</label> <br>
      <input type="text">
      <br>
      <label for="picture" required>Picture</label> <br>
      <input type="file">
      
    </form>
   
    </center>

</body>
</html>
